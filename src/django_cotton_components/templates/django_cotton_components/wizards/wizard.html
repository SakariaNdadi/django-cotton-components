<div class="dcc-wizard">
  <ol class="dcc-wizard__steps">
    {% for name, title in step_titles %}
    <li class="dcc-wizard__step{% if name == current_step %} is-current{% endif %}">{{ title }}</li>
    {% endfor %}
  </ol>
  <form method="post" enctype="multipart/form-data" class="dcc-form">
    {% csrf_token %}
    {{ wizard.management_form }}
    {{ schema_html }}
    <div class="dcc-wizard__nav">
      {% if wizard.steps.prev %}
      <button type="submit" name="wizard_goto_step" value="{{ wizard.steps.prev }}"
        class="dcc-btn dcc-btn--secondary" formnovalidate>Back</button>
      {% endif %}
      <button type="submit" class="dcc-btn dcc-btn--primary">
        {% if wizard.steps.current == wizard.steps.last %}Finish{% else %}Next{% endif %}
      </button>
    </div>
  </form>
</div>
