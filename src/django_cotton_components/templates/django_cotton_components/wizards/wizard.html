<div class="dcc-wizard" id="{{ wizard_id }}">
  <ol class="dcc-wizard__steps">
    {% for name, title in step_titles %}
    <li class="dcc-wizard__step{% if name == current_step %} is-current{% endif %}">{{ title }}</li>
    {% endfor %}
  </ol>
  <form method="post" enctype="multipart/form-data" class="dcc-form" {{ wizard_htmx }}>
    {% csrf_token %}
    {{ wizard.management_form }}
    {{ schema_html }}
    <div class="dcc-wizard__nav">
      {% if wizard.steps.prev %}
      <c-dcc.button type="submit" variant="secondary" label="Back"
        name="wizard_goto_step" value="{{ wizard.steps.prev }}" formnovalidate />
      {% endif %}
      <c-dcc.button type="submit" variant="primary">{% if wizard.steps.current == wizard.steps.last %}Finish{% else %}Next{% endif %}</c-dcc.button>
    </div>
  </form>
</div>
