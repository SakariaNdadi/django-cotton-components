<div class="dcc-widget__label">{{ label }}</div>
<div class="dcc-chart">
  {% for bar in bars %}
  <div class="dcc-chart__row">
    <span class="dcc-chart__key">{{ bar.label }}</span>
    <span class="dcc-chart__track"><span class="dcc-chart__fill" style="width: {{ bar.pct }}%"></span></span>
    <span class="dcc-chart__num">{{ bar.value }}</span>
  </div>
  {% endfor %}
</div>
